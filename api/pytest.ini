[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
log_cli = true
log_cli_level = WARNING
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    slow: tests qui prennent du temps (réseau, gros fichiers)
    unit: tests unitaires (sans I/O)
    integration: tests d'intégration (HTTP, DB)
